/**:
  ros__parameters:
    common:
      img_topic: "/camera/rgbd_front_left/color/image_raw"
      lid_topic: "/livox/lidar"
      imu_topic: "/livox/imu"
      img_en: 1
      lidar_en: 1
      ros_driver_bug_fix: false
      enable_image_processing: true
      camera_count: 2
      single_vio_manager_mode: false 

    camera_1:
      img_topic: "/camera/rgbd_front_left/color/image_raw"
      calib_ns: "camera_1"
      time_offset: 0.0
      # lidar - front leftcam 
      Rcl: [-0.828429, -0.472510,  0.300733, 
            0.004545, -0.542586, -0.839988,
            0.560076, -0.694503,  0.451641]
      Pcl: [0.218868, 0.134147, -0.029091]

    camera_2:
      img_topic: "/camera/rgbd_front_right/color/image_raw"
      calib_ns: "camera_2"
      time_offset: 0.0 
      # lidar - front right cam 
      Rcl: [-0.818771,  0.493977, -0.292576,
            -0.026349, -0.541403, -0.840350,
            -0.573515, -0.680345,  0.456301]
      Pcl: [-0.175616, 0.152070, -0.073612]

    extrin_calib:
      extrinsic_T: [0.011, 0.02329, -0.04412] # lidar-imu
      extrinsic_R: [1., 0., 0., 0., 1., 0., 0., 0., 1.]
      # this rcl pcl not used when camera_1,2,,, used. 
      Rcl: [0.8459084992484703, -0.4535552772229826, 0.28058228989439776, 0.3274101197085882, 0.026335829096533758, -0.9445152394843643, 0.4210005040514897, 0.8908389498719628, 0.17077628927755173]
      Pcl: [0.022648260370124056, -0.09188984649611615, -0.03436178897905727]
      
    time_offset:
      imu_time_offset: 0.0
      img_time_offset: 0.0
      exposure_time_init: 0.0

    preprocess:
      point_filter_num: 1
      filter_size_surf: 0.001
      lidar_type: 1 # Livox Mid-360 LiDAR
      scan_line: 4
      blind: 0.5

    vio:
      max_iterations: 5
      outlier_threshold: 1000 # 78 100 156 #100 200 500 700 infinite
      img_point_cov: 100 # 100 1000
      patch_size: 8
      patch_pyrimid_level: 4
      normal_en: true
      raycast_en: false
      inverse_composition_en: false
      exposure_estimate_en: true
      inv_expo_cov: 0.1

    imu:
      imu_en: true
      imu_int_frame: 30
      acc_cov: 0.8 # 0.2
      gyr_cov: 0.5 # 0.5
      b_acc_cov: 0.001 # 0.1
      b_gyr_cov: 0.001 # 0.1

    lio:
      max_iterations: 5
      dept_err: 0.02
      beam_err: 0.15
      min_eigen_value: 0.005 # 0.005
      voxel_size: 0.5 # 1.0
      max_layer: 2
      max_points_num: 50
      layer_init_num: [5, 5, 5, 5, 5]

    local_map:
      map_sliding_en: false
      half_map_size: 100
      sliding_thresh: 8.0

    uav:
      imu_rate_odom: false
      gravity_align_en: true

    publish:
      dense_map_en: true
      pub_effect_point_en: false
      pub_plane_en: false
      pub_scan_num: 1
      blind_rgb_points: 0.0

    evo:
      seq_name: "marvin_main2loop"
      pose_output_en: true
      pose_output_path: "Log/result/trajectory.txt"


    pcd_save:
      pcd_save_en: true
      colmap_output_en: false # need to set interval = -1
      filter_size_pcd: 0.15
      interval: -1
      # how many LiDAR frames saved in each pcd file;
      # -1 : all frames will be saved in ONE pcd file, may lead to memory crash when having too much frames.
